<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>État civil du Wakanda — Carte nationale d'identité</title>
<meta property="og:title" content="État civil du Wakanda">
<meta property="og:description" content="Bureau de l'état civil. Inscription des citoyens et délivrance de la carte nationale d'identité.">
<meta name="theme-color" content="#0a0705">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --void:#0a0705;--void2:#130c08;--surf:#1b1109;--surf2:#241811;
  --line:#402c1e;--i0:#f8eeda;--i1:#e0cbab;--i2:#ac9377;--i3:#7b6350;
  --grn:#0f7a3d;--grn2:#0a5c2d;--red:#e02b26;--red2:#a81f1b;--yel:#f2e02c;
  --gold:#e0ab48;--goldg:#f6d18a;--vib:#a865e8;--vibg:#cba4f5;--tur:#2fa8a0;--turg:#68e0d6;
  --fd:'Cinzel',serif;--fu:'Rajdhani',sans-serif;--fb:'Work Sans',sans-serif;--fm:'Space Mono',monospace;
  --ez:cubic-bezier(.22,.85,.32,1);--ezo:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:dark;}
body{margin:0;background:var(--void);color:var(--i1);font-family:var(--fb);font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:radial-gradient(ellipse 880px 560px at 50% -4%,rgba(15,122,61,.16),transparent 62%),
             radial-gradient(ellipse 760px 520px at 86% 84%,rgba(224,43,38,.12),transparent 62%),
             radial-gradient(ellipse 620px 460px at 8% 78%,rgba(224,171,72,.08),transparent 62%);
  animation:aur 26s ease-in-out infinite alternate;}
@keyframes aur{50%{transform:scale(1.05) translateY(1%);}}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.36;
  background-image:linear-gradient(135deg,rgba(224,171,72,.05) 25%,transparent 25.5%),
                   linear-gradient(225deg,rgba(224,171,72,.05) 25%,transparent 25.5%);
  background-size:32px 24px;}
#dust{position:fixed;inset:0;z-index:-2;pointer-events:none;}
h1,h2,h3{margin:0;font-family:var(--fd);color:var(--i0);font-weight:600;letter-spacing:.02em;}
p{margin:0 0 .9em;}p:last-child{margin:0;}
button,input,select,textarea{font:inherit;}
::selection{background:var(--gold);color:#170e05;}
img{display:block;max-width:100%;}
.mono{font-family:var(--fm);}
.eyebrow{font-family:var(--fu);text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:600;color:var(--goldg);}
.gw{display:inline-flex;gap:.14em;vertical-align:middle;}
.gw svg{height:1em;width:auto;overflow:visible;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(10,7,5,.6);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--grn2),var(--grn));border-radius:4px;}

/* ---------- barre ---------- */
.top{position:sticky;top:0;z-index:120;display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;padding:11px 18px;padding-top:calc(11px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(19,12,8,.96),rgba(10,7,5,.72));backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(224,171,72,.22);}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--grn) 0 33%,var(--red) 33% 66%,#111 66% 100%);opacity:.75;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand .em{width:36px;height:36px;object-fit:contain;flex:none;filter:drop-shadow(0 0 10px rgba(224,43,38,.5));
  transition:transform .5s var(--ezo);}
.brand:hover .em{transform:scale(1.08) rotate(-4deg);}
.brand .n{font-family:var(--fd);font-size:15px;color:var(--i0);line-height:1.15;}
.brand .s{font-family:var(--fu);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--i3);}
.nav{display:flex;gap:3px;flex-wrap:wrap;}
.nav button{padding:8px 14px;font-family:var(--fu);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;background:transparent;border:none;color:var(--i3);cursor:pointer;transition:all .22s var(--ez);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);}
.nav button:hover{color:var(--i1);}
.nav button.on{color:var(--goldg);background:rgba(224,171,72,.14);box-shadow:inset 0 0 0 1px rgba(246,209,138,.4);}
.trt{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:10.5px;color:var(--i3);}

main{max-width:1080px;margin:0 auto;padding:24px 16px 70px;}
.head{margin-bottom:22px;padding-bottom:16px;position:relative;}
.head h1{font-size:clamp(21px,3.6vw,31px);margin-top:5px;}
.head p{color:var(--i2);max-width:74ch;margin-top:8px;font-size:14px;}
.head::after{content:'';display:block;height:4px;max-width:240px;margin-top:14px;
  background:linear-gradient(90deg,var(--grn) 0 33%,var(--red) 33% 66%,#1a1a1a 66% 100%);opacity:.85;}
.panel{padding:20px;background:linear-gradient(158deg,rgba(40,27,19,.6),rgba(9,6,4,.86));backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1px rgba(224,171,72,.2);animation:pIn .55s var(--ezo) both;
  clip-path:polygon(0 15px,15px 0,calc(100% - 15px) 0,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0 calc(100% - 15px));}
@keyframes pIn{from{opacity:0;transform:translateY(14px);filter:blur(6px);}to{opacity:1;transform:none;filter:none;}}
.panel+.panel{margin-top:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;}
.sub{font-family:var(--fd);font-size:16.5px;color:var(--i0);margin:26px 0 12px;padding-left:18px;position:relative;}
.sub::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:9px;height:9px;
  background:var(--goldg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.row:last-child{border-bottom:none;}
.row .k{font-family:var(--fu);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--i3);}
.row .v{font-family:var(--fm);font-size:12px;color:var(--i0);text-align:right;}
.row .v.ok{color:var(--turg);}.row .v.gold{color:var(--goldg);}
.btn{padding:10px 17px;font-family:var(--fu);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--goldg);background:linear-gradient(160deg,rgba(224,171,72,.12),transparent);border:none;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(224,171,72,.5);transition:all .22s var(--ez);position:relative;overflow:hidden;
  clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);}
.btn::before{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(246,209,138,.28),transparent);transition:left .6s var(--ez);}
.btn:hover:not(:disabled)::before{left:130%;}
.btn:hover:not(:disabled){background:rgba(224,171,72,.2);box-shadow:inset 0 0 0 1px var(--goldg),0 0 18px -6px rgba(224,171,72,.7);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.sm{padding:7px 12px;font-size:10.5px;}
.btn.grn{color:#5fd88c;box-shadow:inset 0 0 0 1px rgba(15,122,61,.6);}
.btn.grn:hover:not(:disabled){background:rgba(15,122,61,.22);}
.btn.red{color:#ff8a86;box-shadow:inset 0 0 0 1px rgba(224,43,38,.55);}
.btn.red:hover:not(:disabled){background:rgba(224,43,38,.18);}
.inp,.sel,.txa{width:100%;padding:10px 13px;border:none;outline:none;color:var(--i0);font-family:var(--fb);font-size:14px;
  background:linear-gradient(158deg,rgba(36,24,17,.72),rgba(11,7,5,.88));box-shadow:inset 0 0 0 1px var(--line);
  clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);transition:box-shadow .3s var(--ez);}
.inp:focus,.sel:focus,.txa:focus{box-shadow:inset 0 0 0 1px var(--gold),0 0 18px -8px rgba(224,171,72,.8);}
.sel option{background:#1a110c;color:var(--i1);}
.lbl{font-family:var(--fu);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--i3);margin-bottom:5px;display:block;}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.frm .w2{grid-column:1/-1;}
@media(max-width:620px){.frm{grid-template-columns:1fr;}.inp,.sel,.txa{font-size:16px;}}
.drop{padding:20px 14px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);background:rgba(27,17,9,.5);
  transition:all .3s var(--ez);clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
.drop:hover{box-shadow:inset 0 0 0 1px var(--gold);transform:translateY(-2px);}
.drop img{max-height:120px;margin:0 auto 8px;}
.drop .t{font-family:var(--fu);font-size:12px;color:var(--i2);letter-spacing:.05em;}
.empty{padding:30px;text-align:center;font-family:var(--fm);font-size:12.5px;color:var(--i3);}
.pill{font-family:var(--fm);font-size:10px;color:var(--i3);padding:6px 11px;box-shadow:inset 0 0 0 1px var(--line);
  clip-path:polygon(0 6px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.tools .grow{flex:1;min-width:170px;}

/* ---------- fiches citoyens ---------- */
.cit{padding:0;overflow:hidden;cursor:pointer;transition:transform .3s var(--ez),box-shadow .3s var(--ez);
  background:linear-gradient(158deg,rgba(40,27,19,.66),rgba(10,7,5,.88));box-shadow:inset 0 0 0 1px rgba(224,171,72,.18);
  clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px));}
.cit:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--goldg),0 0 26px -10px rgba(224,171,72,.5);}
.cit .ph{aspect-ratio:1;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(224,171,72,.14),rgba(16,10,7,.9) 72%);
  display:flex;align-items:center;justify-content:center;position:relative;}
.cit .ph img{width:100%;height:100%;object-fit:cover;}
.cit .ph .no{width:44%;height:44%;color:var(--i3);}
.cit .ph .fl{position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--grn) 0 33%,var(--red) 33% 66%,#111 66% 100%);}
.cit .bd{padding:13px 14px;}
.cit h3{font-size:14.5px;}
.cit .m{font-family:var(--fm);font-size:10px;color:var(--i3);margin-top:3px;}
.cit .id{font-family:var(--fm);font-size:10.5px;color:var(--goldg);margin-top:6px;}

/* ---------- carte d'identité ---------- */
.cardwrap{perspective:1600px;max-width:640px;margin:0 auto;}
.cardflip{position:relative;transform-style:preserve-3d;transition:transform .9s var(--ezo);}
.cardflip.back{transform:rotateY(180deg);}
.face{backface-visibility:hidden;}
.face.b{position:absolute;inset:0;transform:rotateY(180deg);}
canvas.card{width:100%;height:auto;display:block;
  box-shadow:0 26px 60px -26px rgba(0,0,0,.9),0 0 50px -22px rgba(224,171,72,.5);
  clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px));}
.cardacts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
#toasts{position:fixed;bottom:18px;right:18px;z-index:800;display:flex;flex-direction:column;gap:9px;width:310px;max-width:calc(100vw - 36px);}
.toast{padding:11px 13px;font-family:var(--fu);font-size:12.5px;color:var(--i1);transform:translateX(120%);opacity:0;
  animation:ti .5s var(--ezo) forwards;background:linear-gradient(150deg,rgba(36,24,17,.96),rgba(11,7,5,.96));
  backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(224,171,72,.3),inset 3px 0 0 var(--goldg);
  clip-path:polygon(0 9px,9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
@keyframes ti{to{transform:translateX(0);opacity:1;}}
.toast.out{animation:to .4s forwards;}@keyframes to{to{transform:translateX(120%);opacity:0;}}
.toast b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--goldg);margin-bottom:2px;}
.veil{position:fixed;inset:0;z-index:700;background:rgba(6,4,2,.88);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:all .35s var(--ez);}
.veil.on{opacity:1;visibility:visible;}
.modal{position:fixed;z-index:701;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);width:min(660px,94vw);max-height:90vh;
  opacity:0;visibility:hidden;transition:all .4s var(--ezo);display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(36,24,17,.97),rgba(9,6,4,.98));backdrop-filter:blur(18px);
  box-shadow:inset 0 0 0 1px rgba(246,209,138,.34),0 40px 100px rgba(0,0,0,.85);
  clip-path:polygon(0 20px,20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px));}
.modal.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);}
.mh{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);gap:12px;flex:none;}
.mb{padding:20px;overflow-y:auto;}
.x{width:28px;height:28px;background:transparent;border:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--i2);cursor:pointer;flex:none;}
.x:hover{color:#ff8a86;box-shadow:inset 0 0 0 1px var(--red);}
.footnote{text-align:center;margin-top:34px;font-family:var(--fm);font-size:11px;color:var(--i3);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>

function wak(p){return String(p).split(' ').map(function(w){return '<span class="gw">'+Array.from(w).map(function(c){return /[a-zA-Z]/.test(c)?gly(c):'';}).join('')+'</span>';}).join(' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fdate(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}

let EM=null,EMOK=false,FL=null,FLOK=false;
function loadImg(src,cb){
  try{const i=new Image();i.onload=function(){cb(i,true);};i.onerror=function(){cb(null,false);};i.src=src;return i;}
  catch(e){cb(null,false);return null;}
}

/* ================= CLANS & DONNÉES ================= */
const CLANS=[
  {id:'FRN',n:'Frontaliers',w:'Border'},{id:'RIV',n:'Rivière',w:'River'},
  {id:'MIN',n:'Mine',w:'Mining'},{id:'MAR',n:'Marchand',w:'Merchant'},
  {id:'JAB',n:'Jabari',w:'Jabari'}
];
const VILLES=['Birnin Zana','Cité d’Or','Birnin S’Yan','Birnin Djata','Province de la Rivière','Hautes Terres'];
const SANG=['O+','O−','A+','A−','B+','B−','AB+','AB−'];
function clanOf(id){return CLANS.filter(function(c){return c.id===id;})[0]||CLANS[0];}
/* Au Wakanda l'état civil ne retient pas de nom de famille : on porte
   son nom propre, suivi de la filiation qui rattache au foyer. */
function filiation(c){
  return c.sexe==='F' ? 'Fille de' : (c.sexe==='M' ? 'Fils de' : 'Enfant de');
}
function nomComplet(c){
  const p=(c.prenom||'').trim();
  const a=(c.nom||'').trim();
  if(p&&a)return p+' — '+filiation(c).toLowerCase()+' '+a;
  return p||a||'—';
}
function nomCourt(c){ return (c.prenom||c.nom||'—').trim(); }

function makeNIN(clan,ts){
  const seg=function(n){let s='';for(let i=0;i<n;i++)s+=ALPHA[Math.floor(Math.random()*ALPHA.length)];return s;};
  const d=new Date(ts||Date.now());
  const base=(clan||'FRN')+seg(2)+String(d.getFullYear()).slice(2)+String(Math.floor(1000+Math.random()*8999));
  let sum=0;base.split('').forEach(function(c,i){sum+=c.charCodeAt(0)*(i+3);});
  return 'WK-'+(clan||'FRN')+'-'+seg(2)+String(d.getFullYear()).slice(2)+'-'+String(Math.floor(1000+Math.random()*8999))+'-'+ALPHA[sum%ALPHA.length];
}

/* ================= STOCK INTERNE =================
   Deux couches, comme sur le portail gouvernemental : un fonds
   publié dans le dépôt (registre-civil.json) commun à tous les
   visiteurs, et les inscriptions faites depuis cet appareil. */
const KEY='wakanda_etat_civil_v1';
let storeOK=true, DEPOT=[], CITOYENS=[];
function loadLocal(){
  try{const r=window.localStorage.getItem(KEY);storeOK=true;return r?JSON.parse(r):[];}
  catch(e){storeOK=false;return [];}
}
function saveLocal(){
  try{
    window.localStorage.setItem(KEY,JSON.stringify(CITOYENS.filter(function(c){return c.source==='local';})));
    storeOK=true;
  }catch(e){storeOK=false;}
  const el=document.getElementById('store-note');
  if(el){
    const nn=CITOYENS.filter(function(c){return c.source==='national';}).length;
    const nd=CITOYENS.filter(function(c){return c.source==='depot';}).length;
    const nl=CITOYENS.filter(function(c){return c.source==='local';}).length;
    el.textContent=nn+' du registre national · '+nd+' du dépôt · '+nl+' sur cet appareil'+(storeOK?'':' (non conservé)');
  }
}
async function loadDepot(){
  try{
    const r=await fetch('registre-civil.json',{cache:'no-store'});
    if(!r.ok)return [];
    const d=await r.json();
    return Array.isArray(d)?d:[];
  }catch(e){return [];}
}
function merge(){
  const local=loadLocal(),out=[],pos={};
  nationalSeed().forEach(function(c){
    pos[c.nin]=out.length;out.push(c);
  });
  DEPOT.forEach(function(c){
    if(!c||!(c.prenom||c.nom))return;
    c.source='depot';
    if(!c.nin)c.nin=makeNIN(c.clan,c.ts);
    if(pos[c.nin]!==undefined)out[pos[c.nin]]=c;
    else{pos[c.nin]=out.length;out.push(c);}
  });
  local.forEach(function(c){
    if(!c||!(c.prenom||c.nom))return;
    c.source='local';
    /* Une fiche locale portant le même numéro national est une
       correction apportée après publication : elle prime sur le
       fonds du dépôt, sinon la modification serait perdue au
       prochain chargement. */
    if(c.nin&&pos[c.nin]!==undefined)out[pos[c.nin]]=c;
    else out.push(c);
  });
  return out;
}

function readImage(file,max,q){
  return new Promise(function(res,rej){
    const rd=new FileReader();
    rd.onerror=function(){rej(new Error('lecture'));};
    rd.onload=function(){
      const img=new Image();
      img.onload=function(){
        try{
          const sc=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',q||.78));
        }catch(e){res(rd.result);}
      };
      img.onerror=function(){res(rd.result);};
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ================= DESSIN DE LA CARTE =================
   Format ID-1 (85,6 × 54 mm) respecté : 1012 × 638 points.
   Le même tracé sert à l'écran et au fichier téléchargé. */
const CW=1012,CH=638;
function guilloche(x,cx,cy,r,turns,col,alpha){
  x.save();x.globalAlpha=alpha||.16;x.strokeStyle=col;x.lineWidth=.7;
  x.beginPath();
  for(let a=0;a<Math.PI*2*turns;a+=0.05){
    const rr=r*(0.62+0.38*Math.sin(a*5));
    const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*0.62;
    if(a===0)x.moveTo(px,py);else x.lineTo(px,py);
  }
  x.stroke();x.restore();
}
function flagBand(x,px,py,w,h){
  /* Bande du drapeau : vert / rouge / noir */
  x.fillStyle='#0f7a3d';x.fillRect(px,py,w,h/3);
  x.fillStyle='#e02b26';x.fillRect(px,py+h/3,w,h/3);
  x.fillStyle='#141414';x.fillRect(px,py+2*h/3,w,h/3);
}
function wakGlyphs(x,text,px,py,size,col){
  /* Les glyphes sont tracés depuis les mêmes chemins que l'interface. */
  x.save();x.fillStyle=col;
  let cx=px;
  Array.from(String(text)).forEach(function(ch){
    const d=WAK_PATHS[ch.toLowerCase()];
    if(!d){cx+=size*0.5;return;}
    try{
      const p=new Path2D(d);
      x.save();x.translate(cx,py);x.scale(size/100,size/100);x.fill(p,'evenodd');x.restore();
    }catch(e){}
    cx+=size*1.12;
  });
  x.restore();
}
function mrz(c){
  const nom=String(c.prenom||c.nom||'').toUpperCase().replace(/[^A-Z]/g,'');
  const pre=String(c.nom||'').toUpperCase().replace(/[^A-Z]/g,'');
  const nin=String(c.nin||'').replace(/-/g,'');
  const l1=('IDWKA'+nin+'<<<').padEnd(44,'<').slice(0,44);
  const l2=(nom+'<<'+pre).padEnd(44,'<').slice(0,44);
  return [l1,l2];
}

/* ================= MODÈLES DE CARTE =================
   Deux gabarits officiels coexistent. Le titulaire choisit le sien ;
   le choix est conservé dans sa fiche et suivi au téléchargement. */
/* Gabarit unique du royaume. */
function drawRecto(x,c){return drawRectoB(x,c);}
function drawVerso(x,c){return drawVersoB(x,c);}
function hexClip(x,px,py,w,h){
  const r=Math.min(w,h)*0.17;
  x.beginPath();
  x.moveTo(px,py+r);x.lineTo(px+r,py);x.lineTo(px+w-r,py);x.lineTo(px+w,py+r);
  x.lineTo(px+w,py+h-r);x.lineTo(px+w-r,py+h);x.lineTo(px+r,py+h);x.lineTo(px,py+h-r);
  x.closePath();
}

/* ================= PORTRAITS =================
   Faute de photographie fournie, le guichet compose un portrait
   officiel : silhouette, teint, coiffe et scarifications sont tirés
   du numéro national, si bien que chaque citoyen a le sien et le
   garde d'une session à l'autre. */
const PEAU=['#5c3a24','#6d4529','#7d5232','#8d6039','#4a2e1c','#96703f','#63402a'];
const TISSU={
  FRN:['#1f6f45','#2d9c62','#0f4a2c'],
  RIV:['#1d6b8c','#2e93b8','#123f52'],
  MIN:['#6b3f8c','#8f5cb0','#42264f'],
  MAR:['#a8762a','#d09c3e','#6d4b18'],
  JAB:['#7a4a2a','#a06a3e','#4a2c18']
};
function hash32(str){
  let h=2166136261;
  String(str).split('').forEach(function(c){h^=c.charCodeAt(0);h=Math.imul(h,16777619);});
  return h>>>0;
}
function rngFrom(seed){
  let x=seed||1;
  return function(){x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296;};
}
const PORTRAITS={};
function portrait(c){
  const key=c.nin||c.id||'x';
  if(PORTRAITS[key])return PORTRAITS[key];
  const W=420,H=520;
  let cv,x;
  try{
    cv=document.createElement('canvas');cv.width=W;cv.height=H;
    x=cv.getContext('2d');
  }catch(e){return null;}
  if(!x)return null;
  /* Le tracé est isolé : un portrait qui échoue ne doit jamais
     empêcher l'affichage de la fiche ni du registre. */
  try{
  const r=rngFrom(hash32(key));
  const clan=TISSU[c.clan]||TISSU.FRN;
  const peau=PEAU[Math.floor(r()*PEAU.length)];
  const fem=c.sexe==='F';

  /* fond : dégradé du clan et trame hexagonale */
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,clan[2]);g.addColorStop(1,'#0a1410');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.2;x.strokeStyle=clan[1];x.lineWidth=1;
  for(let row=0;row<11;row++)for(let q=0;q<9;q++){
    const cx=26+q*52+(row%2?26:0),cy=26+row*50;
    x.beginPath();
    for(let i=0;i<6;i++){
      const a=Math.PI/180*(60*i-30);
      const px=cx+22*Math.cos(a),py=cy+22*Math.sin(a);
      if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.closePath();x.stroke();
  }
  x.restore();
  /* halo */
  const hg=x.createRadialGradient(W/2,H*0.42,20,W/2,H*0.42,W*0.62);
  hg.addColorStop(0,'rgba(246,209,138,.22)');hg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=hg;x.fillRect(0,0,W,H);

  /* buste */
  const cxp=W/2,neck=H*0.66;
  x.fillStyle=clan[0];
  x.beginPath();
  x.moveTo(cxp-172,H);
  x.quadraticCurveTo(cxp-160,neck+34,cxp-58,neck+8);
  x.lineTo(cxp+58,neck+8);
  x.quadraticCurveTo(cxp+160,neck+34,cxp+172,H);
  x.closePath();x.fill();
  /* col brodé */
  x.strokeStyle=clan[1];x.lineWidth=6;
  x.beginPath();
  x.moveTo(cxp-84,neck+30);x.quadraticCurveTo(cxp,neck+74,cxp+84,neck+30);
  x.stroke();
  x.fillStyle='rgba(246,209,138,.85)';
  for(let i=0;i<9;i++){
    const t=i/8,px=cxp-84+t*168,py=neck+30+Math.sin(t*Math.PI)*44;
    x.beginPath();x.arc(px,py,5,0,6.28);x.fill();
  }
  /* cou */
  x.fillStyle=peau;
  x.fillRect(cxp-34,neck-58,68,74);
  /* tête */
  x.beginPath();
  x.ellipse(cxp,H*0.40,92,116,0,0,6.28);
  x.fill();
  /* ombre latérale */
  x.save();x.globalAlpha=.22;x.fillStyle='#000';
  x.beginPath();x.ellipse(cxp+44,H*0.40,48,112,0,0,6.28);x.fill();x.restore();
  /* oreilles */
  x.fillStyle=peau;
  x.beginPath();x.ellipse(cxp-92,H*0.42,14,26,0,0,6.28);x.fill();
  x.beginPath();x.ellipse(cxp+92,H*0.42,14,26,0,0,6.28);x.fill();

  /* coiffe selon le clan */
  x.fillStyle=clan[1];
  if(c.clan==='JAB'){
    /* capuche de fourrure */
    x.beginPath();
    x.moveTo(cxp-104,H*0.40);
    x.quadraticCurveTo(cxp-108,H*0.14,cxp,H*0.16);
    x.quadraticCurveTo(cxp+108,H*0.14,cxp+104,H*0.40);
    x.quadraticCurveTo(cxp+70,H*0.24,cxp,H*0.245);
    x.quadraticCurveTo(cxp-70,H*0.24,cxp-104,H*0.40);
    x.closePath();x.fill();
    x.fillStyle=clan[2];
    for(let i=0;i<16;i++){
      const a=Math.PI*(0.06+i*0.055);
      x.beginPath();
      x.ellipse(cxp-Math.cos(a)*104,H*0.40-Math.sin(a)*106,9,15,-a,0,6.28);x.fill();
    }
  } else if(c.clan==='MAR'){
    /* turban à plis */
    x.beginPath();
    x.moveTo(cxp-96,H*0.36);
    x.quadraticCurveTo(cxp,H*0.10,cxp+96,H*0.36);
    x.quadraticCurveTo(cxp,H*0.29,cxp-96,H*0.36);
    x.closePath();x.fill();
    x.strokeStyle=clan[2];x.lineWidth=5;
    for(let i=0;i<4;i++){
      x.beginPath();
      x.moveTo(cxp-88+i*10,H*0.345-i*8);
      x.quadraticCurveTo(cxp,H*0.15+i*16,cxp+88-i*10,H*0.345-i*8);
      x.stroke();
    }
  } else if(c.clan==='MIN'){
    /* bandeau de mineur et lampe */
    x.fillRect(cxp-96,H*0.255,192,40);
    x.fillStyle='#f6d18a';
    x.beginPath();x.arc(cxp,H*0.275,15,0,6.28);x.fill();
    x.save();x.globalAlpha=.35;x.fillStyle='#f6d18a';
    x.beginPath();x.moveTo(cxp,H*0.275);x.lineTo(cxp-56,0);x.lineTo(cxp+56,0);x.closePath();x.fill();x.restore();
  } else if(fem){
    /* foulard noué */
    x.beginPath();
    x.moveTo(cxp-98,H*0.375);
    x.quadraticCurveTo(cxp,H*0.09,cxp+98,H*0.375);
    x.quadraticCurveTo(cxp,H*0.30,cxp-98,H*0.375);
    x.closePath();x.fill();
    x.fillStyle=clan[2];
    x.beginPath();x.ellipse(cxp+74,H*0.20,30,20,-0.5,0,6.28);x.fill();
  } else {
    /* bandeau tressé */
    x.fillRect(cxp-94,H*0.285,188,26);
    x.strokeStyle=clan[2];x.lineWidth=4;
    for(let i=0;i<11;i++){
      x.beginPath();x.moveTo(cxp-92+i*17,H*0.285);x.lineTo(cxp-80+i*17,H*0.285+26);x.stroke();
    }
  }

  /* traits du visage, sobres */
  const ey=H*0.40;
  x.fillStyle='rgba(18,10,6,.9)';
  [-38,38].forEach(function(dx){
    x.beginPath();x.ellipse(cxp+dx,ey,15,8,0,0,6.28);x.fill();
  });
  x.fillStyle='#f6f0e2';
  [-38,38].forEach(function(dx){
    x.beginPath();x.ellipse(cxp+dx-2,ey-1,6,4,0,0,6.28);x.fill();
  });
  x.strokeStyle='rgba(18,10,6,.75)';x.lineWidth=5;x.lineCap='round';
  [-38,38].forEach(function(dx,i){
    x.beginPath();
    x.moveTo(cxp+dx-19,ey-22);
    x.quadraticCurveTo(cxp+dx,ey-30-(i?0:0),cxp+dx+19,ey-22);
    x.stroke();
  });
  x.lineWidth=4;
  x.beginPath();x.moveTo(cxp,ey+10);x.lineTo(cxp-8,ey+38);x.quadraticCurveTo(cxp,ey+44,cxp+8,ey+38);x.stroke();
  x.beginPath();x.moveTo(cxp-22,ey+62);x.quadraticCurveTo(cxp,ey+74,cxp+22,ey+62);x.stroke();

  /* scarifications rituelles, propres au numéro */
  const nb=1+Math.floor(r()*3);
  x.strokeStyle='rgba(246,209,138,.75)';x.lineWidth=3;
  for(let i=0;i<nb;i++){
    const yy=ey+18+i*13;
    [-1,1].forEach(function(sgn){
      x.beginPath();
      x.moveTo(cxp+sgn*54,yy);x.lineTo(cxp+sgn*(72+i*3),yy-6);x.stroke();
    });
  }
  /* boucles d'oreilles ou perle frontale */
  if(r()<0.55){
    x.fillStyle='#f6d18a';
    x.beginPath();x.arc(cxp-96,H*0.47,7,0,6.28);x.fill();
    x.beginPath();x.arc(cxp+96,H*0.47,7,0,6.28);x.fill();
  }
  if(r()<0.4){
    x.fillStyle='#cba4f5';
    x.beginPath();x.arc(cxp,H*0.315,8,0,6.28);x.fill();
  }
  /* vignettage */
  const vg=x.createRadialGradient(W/2,H*0.44,W*0.3,W/2,H*0.5,W*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');
  x.fillStyle=vg;x.fillRect(0,0,W,H);

  }catch(e){ PORTRAITS[key]=null; return null; }
  let url=null;
  try{url=cv.toDataURL('image/jpeg',0.86);}catch(e){url=null;}
  PORTRAITS[key]=url;
  return url;
}
/* Image décodée du portrait, prête pour le canevas de la carte. */
const PORTIMG={};
function portraitImg(c){
  const key=c.nin||c.id||'x';
  if(PORTIMG[key])return PORTIMG[key];
  const url=portrait(c);
  if(!url)return null;
  try{
    const im=new Image();
    im.onload=function(){ if(VIEW==='carte')redraw(); };
    im.src=url;
    PORTIMG[key]=im;
    return im;
  }catch(e){return null;}
}

/* ---------- RECTO — MODÈLE PANTHÈRE ---------- */
function drawRectoB(x,c){
  const g=x.createLinearGradient(0,0,CW,CH);
  g.addColorStop(0,'#0b2a18');g.addColorStop(.5,'#08150e');g.addColorStop(1,'#050a07');
  x.fillStyle=g;x.fillRect(0,0,CW,CH);
  /* trame hexagonale discrète */
  x.save();x.globalAlpha=.16;x.strokeStyle='#3fbf76';x.lineWidth=.7;
  for(let r=0;r<12;r++){
    for(let q=0;q<18;q++){
      const cx=60+q*62+(r%2?31:0),cy=44+r*54;
      x.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/180*(60*i-30);
        const px=cx+26*Math.cos(a),py=cy+26*Math.sin(a);
        if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
      }
      x.closePath();x.stroke();
    }
  }
  x.restore();
  /* panthère en filigrane à droite */
  if(EMOK&&EM){x.save();x.globalAlpha=.13;x.drawImage(EM,CW-430,CH-430,470,470);x.restore();}
  /* bandeau du drapeau en tête */
  flagBandH(x,0,0,CW,12);
  /* filets d'or */
  x.strokeStyle='rgba(246,209,138,.42)';x.lineWidth=1.6;x.strokeRect(30,30,CW-60,CH-60);
  x.strokeStyle='rgba(63,191,118,.35)';x.lineWidth=1;x.strokeRect(38,38,CW-76,CH-76);
  /* titre */
  x.fillStyle='#f8eeda';x.font='700 27px Cinzel, Georgia, serif';
  x.fillText('WAKANDA',56,88);
  x.fillStyle='#7de0a4';x.font='600 14px Rajdhani, sans-serif';
  x.fillText('CARTE NATIONALE D’IDENTITÉ · UMAZISI',56,112);
  if(EMOK&&EM){x.save();x.shadowColor='rgba(224,43,38,.8)';x.shadowBlur=16;x.drawImage(EM,CW-124,50,72,72);x.restore();}
  /* photographie hexagonale */
  const px=56,py=150,pw=232,ph=286;
  x.save();hexClip(x,px,py,pw,ph);x.clip();
  x.fillStyle='#0d1a12';x.fillRect(px,py,pw,ph);
  const src=(c.__img&&c.photo)?c.__img:portraitImg(c);
  if(src&&src.width){
    const s2=Math.max(pw/src.width,ph/src.height);
    x.drawImage(src,px+(pw-src.width*s2)/2,py+(ph-src.height*s2)/2,src.width*s2,src.height*s2);
  } else {
    x.fillStyle='#33553f';x.font='15px "Space Mono", monospace';x.textAlign='center';
    x.fillText('PHOTOGRAPHIE',px+pw/2,py+ph/2);x.textAlign='left';
  }
  x.restore();
  x.save();hexClip(x,px,py,pw,ph);x.strokeStyle='rgba(246,209,138,.7)';x.lineWidth=2.4;x.stroke();x.restore();
  /* perles Kimoyo sous la photo */
  for(let i=0;i<7;i++){
    const bx=px+16+i*32,by=py+ph+24;
    x.beginPath();x.arc(bx,by,8,0,6.28);
    x.fillStyle=i<4?'rgba(246,209,138,.85)':'rgba(63,191,118,.6)';x.fill();
    x.strokeStyle='rgba(10,20,14,.8)';x.lineWidth=1.4;x.stroke();
  }
  /* champs, en colonnes serrées */
  const fx=px+pw+42;let fy=176;
  const F=[
    ['NOM',String(c.prenom||c.nom||'—').toUpperCase()],
    [filiation(c).toUpperCase(),c.nom||'—'],
    ['NAISSANCE',(c.naissance||'—')+'  ·  '+(c.sexe||'—')],
    ['LIEU',c.lieu||'—'],
    ['CLAN',clanOf(c.clan).n]
  ];
  F.forEach(function(f){
    x.strokeStyle='rgba(63,191,118,.3)';x.lineWidth=1;
    x.beginPath();x.moveTo(fx,fy-16);x.lineTo(CW-72,fy-16);x.stroke();
    x.fillStyle='#5fa87a';x.font='600 10.5px Rajdhani, sans-serif';x.fillText(f[0],fx,fy);
    x.fillStyle='#f8eeda';x.font='600 25px Rajdhani, sans-serif';x.fillText(String(f[1]),fx,fy+27);
    fy+=58;
  });
  /* plaque du numéro national */
  const nx=fx,ny=CH-112;
  x.fillStyle='rgba(246,209,138,.14)';x.fillRect(nx,ny,CW-nx-72,58);
  x.strokeStyle='rgba(246,209,138,.55)';x.lineWidth=1.4;x.strokeRect(nx,ny,CW-nx-72,58);
  x.fillStyle='#5fa87a';x.font='600 10.5px Rajdhani, sans-serif';
  x.fillText('N° NATIONAL',nx+14,ny+18);
  x.fillStyle='#f6d18a';x.font='700 25px "Space Mono", monospace';
  x.fillText(c.nin||'—',nx+14,ny+45);
  wakGlyphs(x,clanOf(c.clan).w.slice(0,5),56,CH-72,22,'rgba(125,224,164,.6)');
}

/* ---------- VERSO — MODÈLE PANTHÈRE ---------- */
function drawVersoB(x,c){
  const g=x.createLinearGradient(CW,0,0,CH);
  g.addColorStop(0,'#0a2415');g.addColorStop(.55,'#070f0a');g.addColorStop(1,'#040705');
  x.fillStyle=g;x.fillRect(0,0,CW,CH);
  x.save();x.globalAlpha=.4;
  for(let i=0;i<60;i++){
    x.strokeStyle=i%2?'rgba(63,191,118,.5)':'rgba(224,43,38,.4)';
    x.lineWidth=.6;x.beginPath();
    const sx=Math.random()*CW,sy=Math.random()*CH;
    x.moveTo(sx,sy);x.lineTo(sx+(Math.random()-.5)*34,sy+(Math.random()-.5)*20);x.stroke();
  }
  x.restore();
  flagBandH(x,0,CH-12,CW,12);
  x.strokeStyle='rgba(246,209,138,.42)';x.lineWidth=1.6;x.strokeRect(30,26,CW-60,CH-66);
  /* grand sceau de vibranium */
  const cx=CW-232,cy=CH/2-14;
  x.save();
  for(let r=1;r<=4;r++){
    x.strokeStyle='rgba(203,164,245,'+(0.4-r*0.06)+')';x.lineWidth=r===1?2:1;
    x.beginPath();x.arc(cx,cy,50+r*28,0,6.28);x.stroke();
  }
  const src=String(c.nin||'wakanda').replace(/[^A-Za-z]/g,'').toLowerCase()||'wakanda';
  for(let i=0;i<14;i++){
    const a=Math.PI*2*i/14-Math.PI/2;
    wakGlyphs(x,src[i%src.length],cx+Math.cos(a)*128-11,cy+Math.sin(a)*128-11,24,
      (i%3)?'rgba(203,164,245,.8)':'rgba(203,164,245,.25)');
  }
  x.fillStyle='rgba(203,164,245,.18)';x.beginPath();x.arc(cx,cy,44,0,6.28);x.fill();
  if(EMOK&&EM){x.save();x.globalAlpha=.9;x.drawImage(EM,cx-38,cy-38,76,76);x.restore();}
  x.restore();
  x.fillStyle='#5fa87a';x.font='600 10.5px Rajdhani, sans-serif';x.textAlign='center';
  x.fillText('SCEAU DE L’ÉTAT CIVIL',cx,cy+186);x.textAlign='left';
  /* données */
  const em=new Date(c.ts||Date.now()),ex=new Date(em.getFullYear()+10,em.getMonth(),em.getDate());
  const F=[
    ['DOMICILE',c.ville||'—'],['PROFESSION',c.metier||'—'],
    ['GROUPE SANGUIN',c.sang||'—'],['TAILLE',(c.taille||'—')+(c.taille?' cm':'')],
    ['DÉLIVRÉE LE',fdate(em)],['EXPIRE LE',fdate(ex)]
  ];
  let fy=98;
  F.forEach(function(f){
    x.fillStyle='#5fa87a';x.font='600 10.5px Rajdhani, sans-serif';x.fillText(f[0],58,fy);
    x.fillStyle='#f8eeda';x.font='600 22px Rajdhani, sans-serif';x.fillText(String(f[1]),58,fy+25);
    fy+=54;
  });
  x.fillStyle='#5fa87a';x.font='600 10.5px Rajdhani, sans-serif';
  x.fillText('AUTORITÉ ÉMETTRICE',58,fy);
  x.fillStyle='#f8eeda';x.font='600 17px Rajdhani, sans-serif';
  x.fillText('Bureau de l’état civil — Birnin Zana',58,fy+23);
  /* bande lisible machine, plaque sombre */
  const L=mrz(c);
  x.fillStyle='rgba(4,10,7,.8)';x.fillRect(48,CH-104,CW-96,66);
  x.strokeStyle='rgba(63,191,118,.45)';x.lineWidth=1.2;x.strokeRect(48,CH-104,CW-96,66);
  x.fillStyle='#7de0a4';x.font='700 22px "Space Mono", monospace';
  x.fillText(L[0],60,CH-74);x.fillText(L[1],60,CH-46);
}
function flagBandH(x,px,py,w,h){
  x.fillStyle='#0f7a3d';x.fillRect(px,py,w/3,h);
  x.fillStyle='#e02b26';x.fillRect(px+w/3,py,w/3,h);
  x.fillStyle='#141414';x.fillRect(px+2*w/3,py,w/3,h);
}

const VIEWS={accueil:vAccueil,registre:vRegistre,carte:vCarte,demarches:vDemarches,clans:vClans};
function render(){
  document.getElementById('view').innerHTML=(VIEWS[VIEW]||vAccueil)();
  if(VIEW==='registre')wireRegistre();
  if(VIEW==='carte')wireCarte();
  window.scrollTo({top:0,behavior:'smooth'});
}
function wireRegistre(){
  document.getElementById('q').addEventListener('input',function(e){
    Q=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}
  });
  document.getElementById('fc').addEventListener('change',function(e){FCLAN=e.target.value;render();});
  document.getElementById('add').addEventListener('click',function(){form(null);});
  document.querySelectorAll('[data-c]').forEach(function(el){
    el.addEventListener('click',function(){SEL=Number(el.getAttribute('data-c'));SIDE=0;VIEW='carte';paintNav();render();});
  });
  document.getElementById('exp').addEventListener('click',function(){dump(CITOYENS,'registre-civil-export.json');});
  document.getElementById('pub').addEventListener('click',function(){
    dump(CITOYENS,'registre-civil.json');
    toast('Registre','registre-civil.json généré — déposez-le à la racine du dépôt.');
  });
  document.getElementById('imp-b').addEventListener('click',function(){document.getElementById('imp').click();});
  document.getElementById('imp').addEventListener('change',function(e){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const data=JSON.parse(rd.result);
        if(!Array.isArray(data))throw new Error('format');
        let n=0;
        const seen={};CITOYENS.forEach(function(c){if(c.nin)seen[c.nin]=1;});
        data.forEach(function(c){
          if(c&&c.nom&&!(c.nin&&seen[c.nin])){c.source='local';if(!c.nin)c.nin=makeNIN(c.clan,c.ts);CITOYENS.push(c);n++;}
        });
        saveLocal();preload();render();
        toast('Registre',n+' fiche(s) importée(s).');
      }catch(err){toast('Registre','Fichier illisible.');}
    };
    rd.readAsText(f);e.target.value='';
  });
  saveLocal();
}
function dump(arr,name){
  const clean=arr.map(function(c){
    const o={};Object.keys(c).forEach(function(k){if(k!=='source'&&k!=='__img')o[k]=c[k];});
    return o;
  });
  try{
    const b=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'});
    const l=document.createElement('a');
    l.href=URL.createObjectURL(b);l.download=name;l.style.display='none';
    document.body.appendChild(l);l.click();
    setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);URL.revokeObjectURL(l.href);},1800);
  }catch(e){toast('Registre','Export impossible ici.');}
}
function wireCarte(){
  preload();redraw();
  document.getElementById('who').addEventListener('change',function(e){SEL=Number(e.target.value);SIDE=0;render();});

  document.getElementById('flipb').addEventListener('click',function(){
    SIDE=1-SIDE;
    document.getElementById('flip').classList.toggle('back',!!SIDE);
  });
  document.getElementById('dl').addEventListener('click',downloadBoth);
  document.getElementById('edit').addEventListener('click',function(){
    const c=CITOYENS[SEL];if(!c)return;
    form(c);
  });
  /* Remplacement direct de la photographie, sans rouvrir la fiche. */
  const pf=document.getElementById('photo-f');
  document.getElementById('photo').addEventListener('click',function(){pf.click();});
  pf.addEventListener('change',async function(){
    const f=pf.files&&pf.files[0];if(!f)return;
    const c=CITOYENS[SEL];if(!c)return;
    try{
      c.photo=await readImage(f,640,.8);
      c.__img=null;                 /* l'ancienne image décodée est périmée */
      saveLocal();preload();
      setTimeout(function(){redraw();},60);
      toast('Carte','Photographie remplacée.');
    }catch(e){toast('Carte','Image illisible.');}
    pf.value='';
  });
  document.getElementById('regen').addEventListener('click',function(){
    const c=CITOYENS[SEL];if(!c)return;
    c.nin=makeNIN(c.clan,c.ts);saveLocal();redraw();
    toast('État civil','Nouveau numéro national : '+c.nin);
  });
  document.getElementById('del').addEventListener('click',function(){
    const c=CITOYENS[SEL];if(!c)return;
    if(c.source==='national'){toast('État civil','Fiche du registre national : elle ne peut être radiée depuis le guichet.');return;}
    if(c.source==='depot'){toast('État civil','Fiche publiée au dépôt : retirez-la du fichier registre-civil.json.');return;}
    CITOYENS.splice(SEL,1);SEL=0;saveLocal();
    toast('État civil','Citoyen radié du registre local.');
    VIEW='registre';paintNav();render();
  });
}

/* ---------- téléchargement recto + verso ---------- */
/* Une seule image contient les deux faces, l'une au-dessus de l'autre,
   avec leurs libellés : c'est la pièce complète, pas une moitié. */
function downloadBoth(){
  const c=CITOYENS[SEL];if(!c)return;
  const GAP=34,TOP=54,BOT=34,PADX=30;
  const W=CW+PADX*2,H=TOP+CH+GAP+26+CH+BOT;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  let x;
  try{x=cv.getContext('2d');}catch(e){return;}
  if(!x){toast('Carte','Export impossible dans ce navigateur.');return;}
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#120c08');g.addColorStop(1,'#070504');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  /* bandeau du drapeau en tête */
  x.fillStyle='#0f7a3d';x.fillRect(0,0,W/3,6);
  x.fillStyle='#e02b26';x.fillRect(W/3,0,W/3,6);
  x.fillStyle='#141414';x.fillRect(2*W/3,0,W/3,6);
  x.fillStyle='#f6d18a';x.font='600 20px Rajdhani, sans-serif';
  x.fillText('ROYAUME DU WAKANDA — CARTE NATIONALE D’IDENTITÉ',PADX,36);
  /* recto */
  const off=document.createElement('canvas');off.width=CW;off.height=CH;
  const ox=off.getContext('2d');
  if(ox){
    drawRecto(ox,c);x.drawImage(off,PADX,TOP);
    ox.clearRect(0,0,CW,CH);drawVerso(ox,c);
    x.drawImage(off,PADX,TOP+CH+GAP+26);
  }
  x.fillStyle='#8a7256';x.font='600 15px Rajdhani, sans-serif';
  x.fillText('RECTO',PADX,TOP-10);
  x.fillText('VERSO',PADX,TOP+CH+GAP+16);
  x.fillStyle='#5b4c3d';x.font='12px "Space Mono", monospace';
  x.textAlign='right';
  x.fillText((c.nin||'')+' · '+fdate(new Date(c.ts||Date.now())),W-PADX,H-14);
  x.textAlign='left';
  const nom=String(nomCourt(c)+'-'+(c.nom||'')).toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const name='cni-wakanda-'+nom+'.png';
  const send=function(href,rev){
    const l=document.createElement('a');
    l.href=href;l.download=name;l.style.display='none';
    document.body.appendChild(l);l.click();
    setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);if(rev){try{URL.revokeObjectURL(href);}catch(e){}}},1800);
    toast('Carte','Recto et verso enregistrés : '+name);
  };
  try{
    if(typeof cv.toBlob==='function'){
      cv.toBlob(function(b){
        if(b)send(URL.createObjectURL(b),true);
        else{try{send(cv.toDataURL('image/png'),false);}catch(e){toast('Carte','Export impossible.');}}
      },'image/png');
    } else send(cv.toDataURL('image/png'),false);
  }catch(e){
    try{send(cv.toDataURL('image/png'),false);}catch(e2){toast('Carte','Export impossible.');}
  }
}

function form(existing){

  openModal(existing?'Modifier la fiche':'Inscrire un citoyen',

      '<div><label class="lbl">Ascendance — nom du parent</label><input class="inp" id="f-nom" maxlength="40" placeholder="Ex. Nuta" value="'+esc(c.nom||'')+'"></div>'+
      '<div><label class="lbl">Date de naissance</label><input class="inp" id="f-nai" placeholder="12.04.1996" maxlength="12" value="'+esc(c.naissance||'')+'"></div>'+
      '<div><label class="lbl">Lieu de naissance</label><select class="sel" id="f-lieu">'+
        VILLES.map(function(v){return '<option'+(c.lieu===v?' selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Sexe</label><select class="sel" id="f-sexe">'+
        ['F','M','X'].map(function(s){return '<option'+(c.sexe===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Clan</label><select class="sel" id="f-clan">'+
        CLANS.map(function(x){return '<option value="'+x.id+'"'+(c.clan===x.id?' selected':'')+'>'+x.n+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Domicile</label><select class="sel" id="f-ville">'+
        VILLES.map(function(v){return '<option'+(c.ville===v?' selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Profession</label><input class="inp" id="f-met" maxlength="40" value="'+esc(c.metier||'')+'"></div>'+
      '<div><label class="lbl">Groupe sanguin</label><select class="sel" id="f-sang">'+
        SANG.map(function(s){return '<option'+(c.sang===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Taille (cm)</label><input class="inp" id="f-tai" type="number" min="50" max="250" value="'+esc(c.taille||'')+'"></div>'+
    '</div>'+
    '<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;">'+
      '<button class="btn sm" id="f-x">Annuler</button>'+
      '<button class="btn" id="f-go">'+(existing?'Enregistrer':'Inscrire et éditer la carte')+'</button></div>');
  const drop=document.getElementById('f-drop'),file=document.getElementById('f-file');
  drop.addEventListener('click',function(){file.click();});
  file.addEventListener('change',async function(){
    const f=file.files&&file.files[0];if(!f)return;
    photo=await readImage(f,640,.8);
    drop.innerHTML='<img src="'+photo+'"><div class="t">Changer la photographie</div>';
  });
  document.getElementById('f-x').addEventListener('click',closeModal);
  document.getElementById('f-go').addEventListener('click',function(){
    const propre=document.getElementById('f-pre').value.trim();
    if(!propre){toast('État civil','Le nom propre est obligatoire.');return;}
    const nom=document.getElementById('f-nom').value.trim();
    const clan=document.getElementById('f-clan').value;
    const rec={
      id:existing?existing.id:uid(),nom:nom,
      prenom:propre,
      naissance:document.getElementById('f-nai').value.trim(),
      lieu:document.getElementById('f-lieu').value,
      sexe:document.getElementById('f-sexe').value,
      clan:clan,ville:document.getElementById('f-ville').value,
      metier:document.getElementById('f-met').value.trim(),
      sang:document.getElementById('f-sang').value,
      taille:document.getElementById('f-tai').value,
      photo:photo,ts:existing?existing.ts:Date.now(),
      nin:existing?(existing.clan===clan?existing.nin:makeNIN(clan)):makeNIN(clan),
      source:'local'
    };
    if(existing){
      const i=CITOYENS.indexOf(existing);rec.__img=existing.__img;CITOYENS[i]=rec;SEL=i;
      if(rec.photo!==existing.photo)rec.__img=null;
      /* Coiffe et teint dépendent du clan et du sexe : on redessine. */
      if(rec.clan!==existing.clan||rec.sexe!==existing.sexe){
        delete PORTRAITS[rec.nin];delete PORTIMG[rec.nin];
      }
      toast('État civil','Fiche mise à jour.');
    } else {
      CITOYENS.push(rec);SEL=CITOYENS.length-1;
      toast('État civil',nomComplet(rec)+' — numéro '+rec.nin);
    }
    saveLocal();preload();closeModal();
    VIEW='carte';SIDE=0;paintNav();render();
  });
}

/* ================= POUSSIÈRE ================= */
(function dust(){
  try{
    const c=document.getElementById('dust');if(!c||typeof c.getContext!=='function')return;
    const x=c.getContext('2d');if(!x)return;
    let W,H;const P=[];
    function rs(){W=c.width=innerWidth;H=c.height=innerHeight;}
    rs();addEventListener('resize',rs);
    for(let i=0;i<44;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.3,
      s:.05+Math.random()*.22,a:.08+Math.random()*.4,t:Math.random()*6.28,k:Math.random()});
    (function loop(){
      try{
        x.clearRect(0,0,W,H);
        P.forEach(function(p){
          p.y-=p.s;p.t+=.02;
          if(p.y<-8){p.y=H+8;p.x=Math.random()*W;}
          const a=p.a*(.55+.45*Math.sin(p.t));
          x.beginPath();
          x.fillStyle=p.k<.34?'rgba(95,216,140,'+a+')':(p.k<.67?'rgba(255,138,134,'+a+')':'rgba(246,209,138,'+a+')');
          x.arc(p.x,p.y,p.r,0,6.28);x.fill();
        });
        requestAnimationFrame(loop);
      }catch(e){}
    })();
  }catch(e){}
})();

})();
